<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Telegram User ID</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Tahoma, Arial, sans-serif;
      background: linear-gradient(135deg, #dff7ff, #aee8ff, #d8f5ff);
      color: #073b52;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow: hidden;
    }

    .top-box {
      width: min(720px, calc(100% - 30px));
      margin-top: 24px;
      padding: 18px 22px;
      border-radius: 18px;
      background: rgba(255,255,255,.78);
      border: 1px solid rgba(255,255,255,.95);
      box-shadow: 0 10px 30px rgba(0,100,150,.14);
      backdrop-filter: blur(10px);
      text-align: center;
    }

    .top-box h2 {
      margin: 0 0 10px;
      font-size: 20px;
    }

    .id {
      direction: ltr;
      display: inline-block;
      min-width: 220px;
      padding: 10px 16px;
      border-radius: 12px;
      background: #ffffff;
      font-size: 19px;
      font-weight: bold;
      color: #087ea4;
      box-shadow: inset 0 0 0 1px #c5edf9;
    }

    .hint {
      margin: 9px 0 0;
      font-size: 12px;
      opacity: .75;
    }

    .logo-wrap {
      flex: 1;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      padding-bottom: 5vh;
    }

    .logo {
      width: min(68vw, 430px);
      aspect-ratio: 1;
      object-fit: cover;
      border-radius: 50%;
      border: 4px solid #178fff;
      box-shadow:
        0 0 18px rgba(0,145,255,.7),
        0 0 55px rgba(0,145,255,.35);
      animation: float 3.2s ease-in-out infinite, glow 2s ease-in-out infinite alternate;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-14px) scale(1.025); }
    }

    @keyframes glow {
      from { filter: brightness(1); }
      to { filter: brightness(1.15); }
    }

    .error {
      color: #b42318;
      font-size: 13px;
      margin-top: 8px;
    }
  </style>
</head>
